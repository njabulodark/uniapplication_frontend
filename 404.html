<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Redirect to index.html while preserving the full path for React Router
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    // Redirect to /index.html with the original path as a query parameter
    window.location.href = '/index.html?redirect=' + encodeURIComponent(path + search + hash);
  </script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; font-family: Arial, sans-serif;">
    <div style="font-size: 24px; margin-bottom: 20px;">Loading...</div>
    <div style="width: 40px; height: 40px; border: 4px solid #3498db; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>
</body>
</html>
